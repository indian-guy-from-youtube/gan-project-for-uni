# ─── Server ────────────────────────────────────────────────
server.port=8080

# ─── Python GAN server URL ──────────────────────────────────
python.server.url=${PYTHON_SERVER_URL:http://localhost:5000}

# ─── Database (H2 in-memory) ───────────────────────────────
spring.datasource.url=jdbc:h2:file:./data/styletransfer
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (удобно для просмотра БД в браузере)
spring.h2.console.enabled=true  
spring.h2.console.path=/h2-console

# ─── Multipart (увеличиваем лимит для изображений) ─────────
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# ─── Logging ───────────────────────────────────────────────
logging.level.com.styletransfer=INFO
logging.level.org.springframework.web=WARN